[workspace]
members = ["crates/mfkey-core", "crates/mfkey-flipper", "crates/mfkey-cli"]
resolver = "3"

[workspace.package]
version = "1.0.8"
edition = "2024"
authors = ["Lemn4t"]
license = "GPL-3.0-only"
repository = "https://github.com/phntm-lab/mfkey_desktop_cli"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
