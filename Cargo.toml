[package]
name = "mfkey_desktop_cli"
version = "1.0.7"
edition = "2024"
authors = ["Lemn4t"]
description = "Desktop tool for recovering MIFARE Classic keys, modified to match Flipper Zero mfkey behavior."
license = "GPL-3.0-only"
repository = "https://github.com/phntm-lab/mfkey_desktop_cli"
readme = "README.md"

[dependencies]
dialoguer = "0.12.0"
console = "0.16.4"
indicatif = "0.18.6"
colored = "3.1.1"
ctrlc = "3.5.2"
serialport = "4.9.0"
prost = "0.14.4"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
rayon = "1.12.0"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
yaml_serde = "0.10.4"
thiserror = "2.0.20"
btleplug = "0.12.0"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
futures = "0.3.33"
uuid = "1.24.0"
once_cell = "1.21.4"

[build-dependencies]
cc = "1.4.2"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
