name: Build release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
          - os_name: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          # Intel (cross-compiled on an Apple Silicon runner)
          - os_name: macos
            arch: x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            bin_ext: ""
          # Apple Silicon
          - os_name: macos
            arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libdbus-1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN_NAME="mfkey_desktop_cli${{ matrix.bin_ext }}"
          OUT_NAME="mfkey_desktop_cli_${{ matrix.os_name }}_${{ matrix.arch }}${{ matrix.bin_ext }}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${OUT_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfkey_desktop_cli_${{ matrix.os_name }}_${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_FILE="CHANGELOG.md"
          OUT_FILE="RELEASE_NOTES.md"

          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            echo "::warning::$CHANGELOG_FILE not found, falling back to auto-generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk -v ver="$VERSION" '
            /^##[[:space:]]/ {
              if (capture == 1) { exit }
              if (index($0, ver) > 0) {
                capture = 1
                next
              }
            }
            capture == 1 { print }
          ' "$CHANGELOG_FILE" > "$OUT_FILE"

          sed -i -e '/./,$!d' "$OUT_FILE"
          tac "$OUT_FILE" | sed -e '/./,$!d' | tac > "${OUT_FILE}.tmp" && mv "${OUT_FILE}.tmp" "$OUT_FILE"

          if [[ ! -s "$OUT_FILE" ]]; then
            echo "::warning::No changelog section found for version $VERSION, falling back to auto-generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "----- Release notes for v$VERSION -----"
          cat "$OUT_FILE"
          echo "---------------------------------------"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums and notes footer
        shell: bash
        run: |
          cd release
          sha256sum mfkey_desktop_cli_* > SHA256SUMS
          cd ..
          echo "----- SHA256SUMS -----"
          cat release/SHA256SUMS

          if [[ -f RELEASE_NOTES.md ]]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "### 🔒 Verifying your download"
              echo ""
              echo "SHA-256 checksums are attached as \`SHA256SUMS\`:"
              echo ""
              echo '```'
              cat release/SHA256SUMS
              echo '```'
              echo ""
              echo "Verify with \`sha256sum -c SHA256SUMS\` (Linux/macOS) or \`certutil -hashfile <file> SHA256\` (Windows)."
              echo ""
              echo "> **Antivirus note:** as a MIFARE key-recovery tool, this binary may be flagged as a false positive or as \"HackTool/PUA\" by some antivirus engines. It is open-source (build it yourself) and the binaries are unsigned — verify the checksum above and, if needed, report the false positive to your AV vendor."
            } >> RELEASE_NOTES.md
          fi

      - name: Create / update release (from CHANGELOG)
        if: steps.changelog.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: release/*
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create / update release (auto notes fallback)
        if: steps.changelog.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
