[package]
name = "mfkey_desktop_cli"
version = "1.0.3"
edition = "2024"
authors = ["Lemn4t"]
description = "Desktop tool for recovering MIFARE Classic keys, modified to match Flipper Zero mfkey behavior."

[dependencies]
dialoguer = "0.12.0"
console = "0.16.3"
indicatif = "0.18.4"
colored = "3.1.1"
ctrlc = "3.5.2"
serialport = "4.9.0"
prost = "0.14.4"
bytes = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
cc = "1.2.65"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
