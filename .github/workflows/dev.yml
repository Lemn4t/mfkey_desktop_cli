name: Build dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }} / ${{ matrix.arch }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      endsWith(github.event.head_commit.message, '[build]')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
          - os_name: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          # Intel
          #   - os_name: macos
          #     arch: x86_64
          #     runner: macos-13
          #     target: x86_64-apple-darwin
          #     bin_ext: ""
          # Apple Silicon
          - os_name: macos
            arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libdbus-1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN_NAME="mfkey_desktop_cli${{ matrix.bin_ext }}"
          OUT_NAME="mfkey_desktop_cli_${{ matrix.os_name }}_${{ matrix.arch }}${{ matrix.bin_ext }}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${OUT_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfkey_desktop_cli_${{ matrix.os_name }}_${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
