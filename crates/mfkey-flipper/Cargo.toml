[package]
name = "mfkey-flipper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Flipper Zero RPC transport (USB serial + BLE) and protobuf framing for mfkey_desktop_cli."

[dependencies]
serialport = "4.9.0"
prost = "0.14.4"
thiserror = "2.0.20"
btleplug = "0.12.0"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
futures = "0.3.33"
uuid = "1.24.0"
once_cell = "1.21.4"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
